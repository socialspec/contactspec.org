publishers:
  heading: For publishers
  lede: From personal websites to CMS platforms
  description: |
    Use the ContactSpec API to give public contact information escape velocity:

    - Create a `contact.vcf` file (vCard 3.0 or newer)
    - Publish it at `/.well-known/contact.vcf`
    - Allow [CORS](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS) requests

    That's it. That's all publishers need to implement.
  cta:
    label: Join the RFC →
    href: https://github.com/socialspec/contactspec.org

subscribers:
  heading: For subscribers
  lede: From RSS feed readers to next-gen social experiences
  description: |
    Use the ContactSpec API to help followers connect and engage with the feeds they follow.

    - Discovery is a single `HTTP GET` request
    - Parse responses using standard vCard libraries
    - Show DM & reply buttons

    That's it. That's all subscribers need to implement.
  cta:
    label: Join the RFC →
    href: https://github.com/socialspec/contactspec.org
  http:
    request:
      label: Request
      badge: Discovery
      method: GET
      url: https://jordandoe.com/.well-known/contact.vcf
      headers:
        - name: Host
          value: jordandoe.com
        - name: Accept
          value: text/vcard
        - name: If-None-Match
          value: '"5eb63bbbe01eeed093cb22bb8f5acdc3"'
    response:
      label: Response
      badge: Verification
      version: HTTP/1.1
      status: 200 OK
      checks:
        - label: TLS certificate for
